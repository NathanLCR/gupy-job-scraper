x-app-environment: &app-environment
  ENVIRONMENT: production
  DEBUG: "false"
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_SHADOW: "false"
  RATE_LIMIT_KEY_SALT: ${RATE_LIMIT_KEY_SALT:-replace-with-at-least-32-random-characters}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-[]}
  TRUST_CLOUDFLARE_CONNECTING_IP: ${TRUST_CLOUDFLARE_CONNECTING_IP:-false}
  ADMIN_AUTH_ENABLED: "true"
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
  EMBEDDING_PROVIDER: cloudflare
  CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-replace-with-cloudflare-account-id}
  CF_API_TOKEN: ${CF_API_TOKEN:-replace-with-cloudflare-api-token}
  CF_EMBEDDING_MODEL: ${CF_EMBEDDING_MODEL:-@cf/baai/bge-small-en-v1.5}
  ACTIVE_EMBEDDING_MODEL: ${ACTIVE_EMBEDDING_MODEL:-@cf/baai/bge-small-en-v1.5}
  POSTGRES_INDEXED_RETRIEVAL_ENABLED: ${POSTGRES_INDEXED_RETRIEVAL_ENABLED:-false}
  EMBEDDING_REEMBED_INTERVAL_SECONDS: ${EMBEDDING_REEMBED_INTERVAL_SECONDS:-900}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skillpulse-db
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: skillpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: skillpulse-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  migrate:
    build:
      context: .
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
    container_name: skillpulse-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      <<: *app-environment
      PORT: 8080
    ports:
      - "8080:8080"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "2"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
    container_name: skillpulse-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment: *app-environment
    command: ["sh", "-c", "python -m scripts.verify_schema && celery -A services.celery_app worker --beat --loglevel=info"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
