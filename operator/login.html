<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillPulse — Operator Console Login</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f7f7f5;
            --surface: #ffffff;
            --border: #d8d8d3;
            --text: #171714;
            --muted: #65655f;
            --accent: #1f5d48;
            --danger: #a2382b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--background);
            color: var(--text);
            font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 420px);
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }
        h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
        p { margin: 0 0 20px; color: var(--muted); }
        label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; }
        input, button {
            width: 100%;
            min-height: 44px;
            border-radius: 6px;
            font: inherit;
        }
        input { padding: 10px 12px; border: 1px solid var(--border); }
        input:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        button {
            margin-top: 12px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { cursor: wait; opacity: .65; }
        #auth-error-msg {
            margin-top: 12px;
            color: var(--danger);
            font-size: 12px;
        }
        a { display: inline-block; margin-top: 20px; color: var(--muted); }
    </style>
</head>
<body>
    <main>
        <h1>Operator Console Login</h1>
        <p>Authenticate to open internal pipeline controls. The credential is exchanged for an HttpOnly session and is not stored by this page.</p>
        <form id="admin-login-form">
            <label for="admin-key-input">Operator secret</label>
            <input type="password" id="admin-key-input" autocomplete="current-password" required autofocus>
            <button type="submit" id="btn-login-submit">Authenticate session</button>
            <div id="auth-error-msg" role="alert" hidden></div>
        </form>
        <a href="/">Return to public application</a>
    </main>
    <script>
        document.getElementById("admin-login-form").addEventListener("submit", async (event) => {
            event.preventDefault();
            const input = document.getElementById("admin-key-input");
            const button = document.getElementById("btn-login-submit");
            const error = document.getElementById("auth-error-msg");
            const key = input.value.trim();
            if (!key) return;

            button.disabled = true;
            error.hidden = true;
            try {
                const response = await fetch("/api/v1/admin/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ key })
                });
                const contentType = response.headers.get("content-type") || "";
                const data = contentType.includes("application/json")
                    ? await response.json()
                    : {};
                if (!response.ok || data.status !== "authenticated" || data.authenticated !== true) {
                    throw new Error(data.detail || "Authentication failed.");
                }
                input.value = "";
                window.location.replace("/operator");
            } catch (caught) {
                input.value = "";
                error.textContent = caught.message || "Authentication failed.";
                error.hidden = false;
                input.focus();
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
