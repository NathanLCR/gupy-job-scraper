[project]
name = "skillpulse-python-worker-dependency-spike"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "pgvector>=0.3.2",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
